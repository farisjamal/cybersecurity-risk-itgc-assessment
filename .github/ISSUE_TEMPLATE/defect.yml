name: Defect
description: Record a reproducible product, assessment, or evidence-integrity defect.
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Portal and authorization
        - Assessment records and validation
        - Evidence and integrity
        - Backup and restoration
        - Export and reporting
        - Tooling and documentation
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Use only synthetic data and remove credentials or raw evidence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed result
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision and environment
    validations:
      required: true
