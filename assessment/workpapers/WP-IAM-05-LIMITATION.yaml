exceptions:
- ARV-001 records reviewer_role only and has no matching completion event identifying an actor. Synthetic
  timestamps and blanket retain decisions do not prove a substantive quarterly review.
- Pre-correction service accepted duplicate/conflicting and missing/blank/non-string decisions. Validation
  corrected and applied to the main app; isolated retest and five-case PostgreSQL READ ONLY smoke passed.
limitations:
- Generated August dates are synthetic; current inspection does not establish historical quarterly operation.
- Blanket retain decisions are not owner authorization of roles; retaining a disabled identity is not
  evidence of reactivation.
- No closed decision vocabulary or referential verification of action_references is implemented by this
  narrow validation correction.
- Targeted tests use service-level SQLite; separate main-lab smoke checks denials with PostgreSQL READ
  ONLY. Neither is a new substantive human review or manual HTTP workflow.
- Project-owner substantive self-review remains open.
- Current owner dispositions do not prove PAM implementation or historical review. Six privileged approvals
  remain conditional; PAM-001 and full role-matrix reconciliation remain open.
