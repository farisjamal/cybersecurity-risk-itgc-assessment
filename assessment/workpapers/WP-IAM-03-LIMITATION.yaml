expected_behavior: Privileged access matches the role matrix and prohibited cross-owner actions are denied.
actual_results: 'Twenty current isolated HTTP cases passed. Privileged routes deny pre-MFA sessions; all
  six privileged fixture identities pass MFA and access event listing. Only administrators list accounts.
  Non-administrator deactivation is denied without changing target status. Staff list/detail/edit access
  is limited to owned/assigned requests; unrelated requests return 404. Change approver/read-only mutations
  are denied with unchanged request history. After the owner selected own/assigned-only read_only scope,
  listing/detail filtering was corrected and all twenty HTTP cases passed again against the selected scope.
  Initial global-read implementation evidence remains preserved separately. The corrected local image
  was applied and verified against the PostgreSQL main lab: USR-019 listed exactly its one eligible request,
  could read that request, and received 404 for an unrelated request. Selected account/request business
  digests matched before and after the app update. Windows and Linux suites each passed 161 tests. Owner
  current dispositions are recorded separately: 15 scoped approvals, six conditional privileged approvals
  requiring RBAC/PAM, and three access denials retaining disabled identities. PAM-001 remains open.'
