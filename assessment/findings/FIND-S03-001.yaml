schema_version: "1.0"
id: FIND-S03-001
title: Password-only scenario session permitted a privileged action
service_ids: [example-bank-portal]
control_ids: [IAM-04]
criteria_reference: POL-03
condition: >-
  The S03 baseline fixture replay observed that a password-only scenario session
  was accepted for a privileged action without completed MFA.
evidence_ids: [EVID-S03-BASELINE]
cause: The isolated scenario path bypassed the privileged-MFA enforcement check.
cause_status: confirmed
consequence: A compromised password could enable privileged actions in the tested local scenario.
likelihood: 4
impact: 4
rating: 16
rating_rationale: The bypass was directly reproducible and affected a privileged action in scope.
recommendation: Enforce completed MFA on every privileged server-side authorization path.
alternatives_tradeoff: Shorter sessions reduce exposure but do not prevent password-only privilege use.
owner_role: simulated_system_administrator
effort: small
target_date: 2026-10-10
status: closed_verified
limitations: >-
  Closure is limited to deterministic local fixture replay. No enterprise identity provider,
  phishing-resistant authentication, production service, or regulatory compliance was assessed.
