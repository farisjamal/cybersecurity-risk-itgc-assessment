{% extends "base.html" %}
{% block title %}Sign in | Example Bank Lab{% endblock %}
{% block content %}
<main>
  <h1>Sign in</h1>
  <p>This page describes the JSON login interface used by the reproducible lab.</p>
  <form aria-describedby="login-help" onsubmit="return false">
    <label for="email">Synthetic email</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" disabled>Use the documented local API client</button>
  </form>
  <p id="login-help">Credentials are generated during local seeding and are never embedded in this page.</p>
</main>
{% endblock %}
